# Render Blueprint — Laravel API + Filament admin
# https://render.com/docs/blueprint-spec
# Dashboard: connect this repo, then set env vars (especially DATABASE_URL from Supabase).

services:
  - type: web
    name: education-inter-api
    runtime: php
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan package:discover --ansi
      php artisan storage:link || true
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /api/home
    envVars:
      - key: APP_NAME
        value: Education Interntions
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
