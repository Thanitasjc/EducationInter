# Render Blueprint — Laravel API + Filament admin
# https://render.com/docs/blueprint-spec
# Dashboard: connect this repo, then set env vars (especially DATABASE_URL from Supabase).

services:
  # Render dashboard no longer lists native PHP — use Docker (backend/Dockerfile).
  - type: web
    name: education-inter-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/home
    # SafeDemoCrmSeeder is insert-only (firstOrCreate) — never wipes/overwrites production rows.
    dockerCommand: php artisan migrate --force && (php artisan db:seed --class=SafeDemoCrmSeeder --force || true) && php artisan view:clear && php artisan config:cache && php artisan route:clear && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: Education Interntions
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      # Laravel 12 reads DB_URL (not DATABASE_URL)
      - key: DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: s3
      - key: MEDIA_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-1
      - key: AWS_BUCKET
        value: media
      - key: AWS_ENDPOINT
        value: https://velpsbmfvdydkhuitizo.storage.supabase.co/storage/v1/s3
      - key: AWS_URL
        value: https://velpsbmfvdydkhuitizo.supabase.co/storage/v1/object/public/media
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Education Interntions

  # Daily CRM follow-up alerts (requires paid cron on some plans; also runnable from Admin → รายงานลีด)
  - type: cron
    name: education-inter-crm-followups
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    schedule: "0 1 * * *"
    dockerCommand: php artisan crm:notify-follow-ups
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
